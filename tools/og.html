<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;background:#fff8f3;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;color:#261c30;display:flex;align-items:center;overflow:hidden}
.l{padding:0 0 0 72px;width:580px}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:34px;margin-bottom:34px}
.brand img{width:64px;height:64px}
h1{font-size:64px;line-height:1.05;margin:0 0 24px;letter-spacing:-.02em}
h1 span{color:#d93d65}
p{font-size:28px;color:#6c6276;margin:0;line-height:1.35}
.card{margin-left:36px;width:430px;background:#fff;border:1px solid #f0e4dc;border-radius:28px;box-shadow:0 20px 50px rgba(50,20,40,.12);padding:28px 30px}
.card h3{margin:0 0 10px;font-size:20px;color:#6c6276;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:18px;padding:13px 0;border-top:1px solid #f0e4dc}
.row:first-of-type{border-top:0}
.d{width:58px;text-align:center}.d b{display:block;font-size:30px;line-height:1}.d span{font-size:14px;font-weight:800;color:#d93d65;letter-spacing:.06em}
.n{font-weight:700;font-size:26px}.s{color:#6c6276;font-size:19px}
</style></head><body>
<div class="l">
  <div class="brand"><img src="../public/icon.svg">Birthday Circle</div>
  <h1>Never forget a birthday <span>in your group</span></h1>
  <p>One link for the group chat. Everyone adds their own birthday. No app, no sign-up.</p>
</div>
<div class="card">
  <h3>Uni friends</h3>
  <div class="row"><div class="d"><b>3</b><span>DEC</span></div><div><div class="n">Sara 🎉</div><div class="s">Today · turns 30</div></div></div>
  <div class="row"><div class="d"><b>14</b><span>DEC</span></div><div><div class="n">Tom</div><div class="s">In 11 days</div></div></div>
  <div class="row"><div class="d"><b>2</b><span>JAN</span></div><div><div class="n">Priya</div><div class="s">In 4 weeks</div></div></div>
  <div class="row"><div class="d"><b>28</b><span>FEB</span></div><div><div class="n">Leo</div><div class="s">In 3 months</div></div></div>
</div>
</body></html>
